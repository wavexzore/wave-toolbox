name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 平台
        run: |
          SDKMGR="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          echo "sdkmanager: $SDKMGR"
          yes 2>/dev/null | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          yes 2>/dev/null | "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: 质量门（test · lint · assembleDebug）
        run: bash scripts/ci.sh
